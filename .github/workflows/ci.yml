name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Python 3.12 tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTENBERG_INTEGRATION: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Browser preference behavior tests
        run: node --test tests/web_preferences.test.cjs
      - name: Ruff
        if: ${{ !cancelled() }}
        run: python -m ruff check .
